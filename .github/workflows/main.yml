name: frontend

on:
  push:
    branches:
      - main

jobs:
  myprojectDeploy:
    runs-on: ubuntu-latest
    # Dependencies install
    steps:
      - name: git library
        uses: actions/checkout@v4
      - name: ssh connection
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{secrets.IP}}
          username: ${{secrets.USERNAME}}
          password: ${{secrets.PASSWORD}}

          script: |
            cd /home/umang/seedlyfrntd
            git pull origin main
            npm i
            pm2 start npm --name "Seedly Frontend" -- run dev
